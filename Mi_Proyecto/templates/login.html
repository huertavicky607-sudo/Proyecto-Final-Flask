<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Iniciar Sesión</title>
	<link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
	<script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
	<script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>
<body>
	<div data-role="page" id="login-page">
		<div data-role="header" data-theme="b">
			<h1>Iniciar Sesión</h1>
		</div>

		<div role="main" class="ui-content">
			{% if error %}
				<div style="background-color: #fee2e2; color: #991b1b; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
					{{ error }}
				</div>
			{% endif %}

			<form action="{{ url_for('login') }}" method="post" data-ajax="false">
				<label for="correo">Correo electrónico:</label>
				<input type="email" name="correo" id="correo" required placeholder="ejemplo@correo.com">

				<label for="password">Contraseña:</label>
				<input type="password" name="password" id="password" required>

				<button type="submit" class="ui-btn ui-btn-b ui-corner-all">Entrar</button>
			</form>

			<div style="margin-top: 20px; text-align: center;">
				<p>¿No tienes cuenta?</p>
				<a href="{{ url_for('registro') }}" class="ui-btn ui-corner-all" data-ajax="false">Crear cuenta nueva</a>
			</div>
		</div>

		<div data-role="footer" data-position="fixed" data-theme="b">
			<h4>Sistema de Autenticación</h4>
		</div>
	</div>

	<!-- BANNER DE COOKIES Y PRIVACIDAD -->
	<div id="cookie-banner" style="display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 480px; background-color: #1e293b; color: #ffffff; padding: 16px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 9999; font-family: sans-serif;">
		<p style="margin: 0 0 12px 0; font-size: 13px; line-height: 1.4; color: #e2e8f0;">
			Usamos cookies para medir cómo se usa este sitio (páginas, clics y tiempo). No registramos lo que escribes en los formularios.
		</p>
		<div style="display: flex; gap: 10px;">
			<button id="aceptar-cookies" type="button" style="background-color: #2563eb; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;">Aceptar</button>
			<button id="rechazar-cookies" type="button" style="background-color: #475569; color: #f1f5f9; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 13px;">Rechazar</button>
		</div>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			function obtenerCookie(nombre) {
				var v = document.cookie.match('(^|;) ?' + nombre + '=([^;]*)(;|$)');
				return v ? v[2] : null;
			}

			var banner = document.getElementById("cookie-banner");
			var decision = obtenerCookie("cookie_consent");

			if (!decision) {
				banner.style.display = "block";
			}

			document.getElementById("aceptar-cookies").addEventListener("click", function() {
				var d = new Date();
				d.setTime(d.getTime() + (365*24*60*60*1000));
				document.cookie = "cookie_consent=accepted; expires=" + d.toUTCString() + "; path=/";
				banner.style.display = "none";
			});

			document.getElementById("rechazar-cookies").addEventListener("click", function() {
				var d = new Date();
				d.setTime(d.getTime() + (30*24*60*60*1000));
				document.cookie = "cookie_consent=rejected; expires=" + d.toUTCString() + "; path=/";
				banner.style.display = "none";
			});
		});
	</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>
<body>
    <div data-role="page" id="login-page">
        <div data-role="header" data-theme="b">
            <h1>Iniciar Sesión</h1>
        </div>

        <div role="main" class="ui-content">
            {% if request.args.get('registrado') %}
                <div style="background-color: #dcfce7; color: #166534; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
                    ¡Cuenta creada exitosamente! Ya puedes iniciar sesión.
                </div>
            {% endif %}

            {% if error %}
                <div style="background-color: #fee2e2; color: #991b1b; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
                    {{ error }}
                </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="post" data-ajax="false">
                <label for="correo">Correo electrónico:</label>
                <input type="email" name="correo" id="correo" required placeholder="ejemplo@correo.com">

                <label for="password">Contraseña:</label>
                <input type="password" name="password" id="password" required>

                <button type="submit" class="ui-btn ui-btn-b ui-corner-all">Entrar</button>
            </form>

            <div style="margin-top: 20px; text-align: center;">
                <p>¿No tienes cuenta?</p>
                <a href="{{ url_for('registro') }}" class="ui-btn ui-corner-all" data-ajax="false">Crear cuenta nueva</a>
            </div>
        </div>

        <div data-role="footer" data-position="fixed" data-theme="b">
            <h4>Sistema de Autenticación</h4>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/global.css') }}">
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>
<body>
    <div data-role="page" id="login-page">
        <div data-role="header" data-theme="b">
            <!-- Botón para volver al menú principal en la esquina superior izquierda -->
            <a href="{{ url_for('menu') }}" data-icon="home" data-ajax="false">Menú</a>
            <h1>Iniciar Sesión</h1>
        </div>

        <div role="main" class="ui-content" style="max-width: 500px; margin: 20px auto;">
            {% if error %}
                <p style="color: red; text-align: center; font-weight: bold;">{{ error }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}" data-ajax="false">
                <label for="correo">Correo electrónico:</label>
                <input type="email" name="correo" id="correo" placeholder="ejemplo@correo.com" required>

                <label for="contrasena">Contraseña:</label>
                <input type="password" name="password" id="contrasena" required>

                <button type="submit" class="ui-btn ui-btn-b ui-corner-all">Entrar</button>
            </form>

            <div style="text-align: center; margin-top: 20px;">
                <p>¿No tienes cuenta?</p>
                <a href="{{ url_for('registro') }}" class="ui-btn ui-corner-all" data-ajax="false">Crear cuenta nueva</a>
            </div>
        </div>

        <div data-role="footer" data-position="fixed">
            <h4>Sistema de Autenticación</h4>
        </div>
    </div>
</body>
</html>

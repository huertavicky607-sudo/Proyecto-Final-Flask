<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión</title>
    <!-- Favicon del rayito estilizado -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/global.css') }}">
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>
<body class="glass-bg" style="position: relative; overflow-x: hidden; margin: 0; padding: 0;">

    <!-- Burbujas decorativas esparcidas por el fondo -->
    <div class="bg-bubble" style="width: 70px; height: 70px; top: 15%; left: 10%;"></div>
    <div class="bg-bubble" style="width: 40px; height: 40px; top: 75%; left: 15%;"></div>
    <div class="bg-bubble" style="width: 50px; height: 50px; top: 25%; right: 12%;"></div>
    <div class="bg-bubble" style="width: 35px; height: 35px; top: 65%; right: 18%;"></div>
    <div class="bg-bubble" style="width: 25px; height: 25px; top: 45%; left: 6%;"></div>
    <div class="bg-bubble" style="width: 45px; height: 45px; bottom: 10%; right: 8%;"></div>

    <div data-role="page" id="login-page" style="background: transparent !important; position: relative; z-index: 2; width: 100%;">
        <div data-role="header" data-theme="b">
            <!-- Botón para volver al menú principal -->
            <a href="{{ url_for('menu') }}" data-icon="home" data-ajax="false">Menú</a>
            <h1>Iniciar Sesión</h1>
        </div>

        <!-- Contenedor principal forzado a centrarse perfectamente -->
        <div role="main" class="ui-content" style="display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 0 !important; margin: 0 auto !important; width: 100%;">
            
            <!-- Contenedor con las gotitas 3D alrededor -->
            <div class="login-wrapper" style="margin: 0 auto; display: flex; justify-content: center;">
                
                <!-- Gotitas pegadas a la tarjeta -->
                <div class="water-drop" style="width: 55px; height: 55px; top: -25px; left: -35px;"></div>
                <div class="water-drop" style="width: 30px; height: 30px; top: 40px; right: -30px;"></div>
                <div class="water-drop" style="width: 25px; height: 25px; bottom: 80px; left: -25px;"></div>
                <div class="water-drop" style="width: 40px; height: 40px; bottom: -20px; right: 30px;"></div>

                <!-- Tarjeta principal de cristal -->
                <div class="glass-login-container" style="margin: 0 auto;">
                    
                    <div style="text-align: center; margin-bottom: 20px;">
                        <h2 style="color: var(--color-principal); margin: 0 0 5px 0;">ElectroRuta</h2>
                        <p style="color: #64748b; font-size: 14px; margin: 0;">Ingresa tus credenciales para continuar</p>
                    </div>

                    {% if error %}
                        <p style="color: red; text-align: center; font-weight: bold; margin-bottom: 15px;">{{ error }}</p>
                    {% endif %}

                    <form method="POST" action="{{ url_for('login') }}" data-ajax="false">
                        <label for="correo" style="font-weight: bold; color: #1e293b;">Correo electrónico:</label>
                        <input type="email" name="correo" id="correo" placeholder="ejemplo@correo.com" class="glass-input" required>

                        <label for="contrasena" style="font-weight: bold; color: #1e293b;">Contraseña:</label>
                        <input type="password" name="password" id="contrasena" class="glass-input" required>

                        <button type="submit" class="glass-btn">Entrar</button>
                    </form>

                    <div style="text-align: center; margin-top: 20px;">
                        <p style="color: #64748b; margin-bottom: 10px;">¿No tienes cuenta?</p>
                        <a href="{{ url_for('registro') }}" class="ui-btn ui-corner-all" data-ajax="false" style="background: rgba(255, 255, 255, 0.8); border: 1px solid #bae6fd; color: #0284c7; font-weight: bold;">Crear cuenta nueva</a>
                    </div>

                </div>
            </div>

        </div>

        <div data-role="footer" data-position="fixed" data-theme="b">
            <h4>Sistema de Autenticación</h4>
        </div>
    </div>
</body>
</html>

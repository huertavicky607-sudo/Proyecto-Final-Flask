<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menú Principal</title>
    <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>
<body>
    <div data-role="page" id="menu-principal">
        <div data-role="header" data-theme="b">
            <h1>Menú Principal</h1>
            <a href="{{ url_for('logout') }}" data-icon="power" class="ui-btn-right" data-ajax="false">Salir</a>
        </div>

        <div role="main" class="ui-content">
            <h2>Bienvenido(a), {{ session['usuario'] }}</h2>
            <p>Selecciona la sección a la que deseas acceder:</p>

            <div class="ui-grid-a">
                <a href="{{ url_for('mapas') }}" class="ui-btn ui-corner-all ui-btn-b" data-ajax="false">🗺️ Mapas (iFrame y API)</a>
                <a href="{{ url_for('presentacion') }}" class="ui-btn ui-corner-all" data-ajax="false">👤 Presentación (Página 2)</a>
                <a href="{{ url_for('youtube') }}" class="ui-btn ui-corner-all" data-ajax="false">▶️ Video de YouTube</a>
                <a href="{{ url_for('encuesta') }}" class="ui-btn ui-corner-all" data-ajax="false">📝 Encuesta de Satisfacción</a>
                <a href="{{ url_for('mensajes') }}" class="ui-btn ui-corner-all" data-ajax="false">💬 Servicio de Mensajería</a>
                <a href="{{ url_for('crud') }}" class="ui-btn ui-corner-all ui-btn-b" data-ajax="false">⚙️ Gestión (CRUD)</a>
            </div>
        </div>

        <div data-role="footer" data-position="fixed">
            <h4>Panel General de Navegación</h4>
        </div>
    </div>
</body>
</html>

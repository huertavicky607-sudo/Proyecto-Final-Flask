<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi ubicación</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Tus estilos generales del proyecto -->
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/app.css') }}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            font-family: system-ui, sans-serif;
            background: #eef2f7;
            color: #1f2937;
        }
        .tarjeta {
            width: 100%;
            max-width: 560px;
            padding: 28px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        h2 { margin-top: 28px; font-size: 1.2rem; }
        button, .boton {
            display: inline-block;
            width: 100%;
            padding: 11px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover, .boton:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .error  { padding: 10px; border-radius: 8px; background: #fee2e2; color: #991b1b; margin-top: 10px; }
        .exito  { padding: 10px; border-radius: 8px; background: #dcfce7; color: #166534; margin-top: 10px; }
        .info   { padding: 10px; border-radius: 8px; background: #dbeafe; color: #1e40af; margin-top: 10px; }
        #mapa {
            width: 100% !important;
            height: 350px !important;
            margin-top: 14px;
            border-radius: 8px;
            z-index: 1;
        }
        .historial { padding-left: 20px; font-size: .85rem; }
        .historial li { margin-bottom: 4px; }
        .btn-volver {
            background: #4b5563;
        }
        .btn-volver:hover {
            background: #374151;
        }
    </style>
</head>
<body>
    <main class="tarjeta">
        <h1>Mi ubicación</h1>
        <p>Sesión: <strong>{{ session.get('nombre', 'Invitado') }}</strong></p>

        <button type="button" id="btn-capturar">Capturar mi ubicación</button>
        <p id="mensaje" hidden></p>
        <p id="datos" hidden></p>

        <div id="mapa"></div>

        <h2>Últimas ubicaciones</h2>
        <ol id="historial" class="historial"></ol>

        <a href="{{ url_for('menu') }}" class="boton btn-volver">← Volver al Menú Principal</a>
    </main>

    <!-- Leaflet JS con integridad obligatoria -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Tu script de geolocalización -->
    <script src="{{ url_for('static', filename='assets/ubicacion.js') }}"></script>
</body>
</html>

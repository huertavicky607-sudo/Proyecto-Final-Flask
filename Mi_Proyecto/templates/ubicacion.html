{% extends 'base.html' %}
{% block title %}Mi ubicación{% endblock %}

{% block head %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
{% endblock %}

{% block content %}
<main class="container page-main">
    <div class="page-hero">
        <h2>Mi ubicación</h2>
        <p>Sesión: <strong>{{ session.get('nombre', 'Invitado') }}</strong></p>
    </div>

    <div class="panel panel-narrow">
        <button type="button" id="btn-capturar" class="btn-primary-pill">
            <i class="fa-solid fa-location-crosshairs"></i> Capturar mi ubicación
        </button>
        <p id="mensaje" hidden></p>
        <p id="datos" hidden></p>

        <div id="mapa"></div>

        <h3 class="sub">Últimas ubicaciones</h3>
        <ol id="historial" class="historial"></ol>

        <a href="{{ url_for('menu') }}" class="btn-outline-pill" style="margin-top: 22px;">
            <i class="fa-solid fa-arrow-left"></i> Volver al catálogo
        </a>
    </div>
</main>
{% endblock %}

{% block scripts %}
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="{{ url_for('static', filename='assets/ubicacion.js') }}"></script>
{% endblock %}

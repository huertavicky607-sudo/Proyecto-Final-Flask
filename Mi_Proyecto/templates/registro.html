{% extends 'base.html' %}
{% block title %}Crear cuenta{% endblock %}

{% block content %}
<main class="container auth-wrap">
    <div class="auth-card">
        <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>
        <h2>Crea tu cuenta</h2>
        <p class="auth-sub">Regístrate para comprar y guardar tus pedidos.</p>

        {% if error %}
            <div class="flash flash-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('registro') }}">
            <div class="form-field">
                <label for="nombre">Nombre completo</label>
                <div class="input-icon">
                    <i class="fa-regular fa-user lead"></i>
                    <input type="text" name="nombre" id="nombre" placeholder="Tu nombre" required autocomplete="name">
                </div>
            </div>

            <div class="form-field">
                <label for="correo">Correo electrónico</label>
                <div class="input-icon">
                    <i class="fa-regular fa-envelope lead"></i>
                    <input type="email" name="correo" id="correo" placeholder="ejemplo@correo.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-field">
                <label for="telefono">Teléfono <span style="color: #94a3b8; font-weight: 400;">(opcional)</span></label>
                <div class="input-icon">
                    <i class="fa-solid fa-phone lead"></i>
                    <input type="tel" name="telefono" id="telefono" placeholder="5512345678" autocomplete="tel">
                </div>
            </div>

            <div class="form-field">
                <label for="password">Contraseña <span style="color: #94a3b8; font-weight: 400;">(mínimo 6 caracteres)</span></label>
                <div class="input-icon has-toggle">
                    <i class="fa-solid fa-lock lead"></i>
                    <input type="password" name="password" id="password" required minlength="6" autocomplete="new-password">
                    <button type="button" class="toggle-pass" data-target="password" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>

            <div class="form-field">
                <label for="confirmar">Confirmar contraseña</label>
                <div class="input-icon has-toggle">
                    <i class="fa-solid fa-lock lead"></i>
                    <input type="password" name="confirmar" id="confirmar" required minlength="6" autocomplete="new-password">
                    <button type="button" class="toggle-pass" data-target="confirmar" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>

            <button type="submit" class="btn-primary-pill" style="margin-top: 6px;">Registrarme</button>
        </form>

        <p class="auth-switch">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></p>
    </div>
</main>
{% endblock %}

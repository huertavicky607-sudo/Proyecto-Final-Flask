<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>
<body>
    <div data-role="page" id="registro-page">
        <div data-role="header" data-theme="b">
            <!-- Botón para volver al menú principal -->
            <a href="{{ url_for('menu') }}" data-icon="home" data-ajax="false">Menú</a>
            <h1>Crear Cuenta</h1>
        </div>

        <div role="main" class="ui-content" style="max-width: 500px; margin: 20px auto;">
            {% if error %}
                <p style="color: red; text-align: center; font-weight: bold;">{{ error }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('registro') }}">
                <label for="nombre">Nombre completo:</label>
                <input type="text" name="nombre" id="nombre" placeholder="Tu nombre" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" name="correo" id="correo" placeholder="ejemplo@correo.com" required>

                <label for="telefono">Teléfono:</label>
                <input type="tel" name="telefono" id="telefono" placeholder="5512345678">

                <label for="password">Contraseña (mínimo 6 caracteres):</label>
                <input type="password" name="password" id="password" required>

                <label for="confirmar">Confirmar contraseña:</label>
                <input type="password" name="confirmar" id="confirmar" required>

                <button type="submit" class="ui-btn ui-btn-b ui-corner-all" style="margin-top: 15px;">Registrarme</button>
            </form>

            <div style="text-align: center; margin-top: 20px;">
                <p>¿Ya tienes cuenta?</p>
                <a href="{{ url_for('login') }}" class="ui-btn ui-corner-all" data-ajax="false">Iniciar Sesión</a>
            </div>
        </div>

        <div data-role="footer" data-position="fixed">
            <h4>Registro de Usuarios</h4>
        </div>
    </div>
</body>
</html>
